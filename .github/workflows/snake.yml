name: Generate Snake Animation

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Generate snake
        uses: Platane/snk@v3
        with:
          github_user_name: vermaaaditya
          outputs: |
            dist/snake.svg?color_snake=F97316&color_dots=#161B22,#0e4429,#006d32,#26a641,#39d353
            dist/snake-orange.svg?palette=github-dark&color_snake=F97316

      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v3
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
